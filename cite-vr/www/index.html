<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Cité portugaise · ETAFAT VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081726" />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #081726; overflow: hidden; font-family: system-ui, sans-serif; color: #eaf4f8; }
    canvas { display: block; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: radial-gradient(circle at 50% 40%, #0d2740, #081726 70%); z-index: 20; transition: opacity .6s ease; text-align: center; padding: 24px; }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 34px; font-weight: 700; letter-spacing: .02em; }
    #loading p { color: #8ee6e4; font-size: 16px; }
    #bar { width: 260px; height: 4px; border-radius: 4px; background: rgba(142,230,228,.2); overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0%; background: #2ab5b4; transition: width .3s; }
    #enter { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 12px; z-index: 15; }
    #enter button { background: rgba(42,181,180,.18); border: 2px solid #2ab5b4; color: #eaf4f8; font: 600 15px system-ui, sans-serif; padding: 11px 22px; border-radius: 999px; cursor: pointer; }
    #enter button:hover { background: rgba(42,181,180,.35); }
    #enter button[disabled] { opacity: .35; cursor: default; }
    #hint { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); color: rgba(234,244,248,.55); font-size: 13px; z-index: 15; pointer-events: none; text-align: center; width: 92%; }
    #credits { position: fixed; left: 14px; bottom: 10px; color: rgba(234,244,248,.35); font-size: 11px; z-index: 15; pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
  </script>
</head>
<body>
  <div id="loading">
    <h1>Cité portugaise de Mazagan</h1>
    <div id="bar"><i></i></div>
    <p id="status">Chargement de la maquette numérique…</p>
  </div>
  <div id="hint">Glissez pour tourner autour · molette pour zoomer · flèches : tourner la maquette · cliquez un point d’intérêt</div>
  <div id="enter"><button id="btn-ar" disabled>Entrer en AR</button><button id="btn-vr" disabled>Entrer en VR</button></div>
  <div id="credits">Maquette 3D par drone — ETAFAT · Positions des lieux : © contributeurs OpenStreetMap</div>
  <script type="module" src="./app.js"></script>
</body>
</html>
