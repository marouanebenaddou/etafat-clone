<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>ETAFAT · Présence VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081726" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="/etafat/evenement/icon-192.png" />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #081726; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: radial-gradient(circle at 50% 40%, #0d2740, #081726 70%); color: #eaf4f8; z-index: 20;
      transition: opacity .6s ease; text-align: center; padding: 24px;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 40px; font-weight: 700; letter-spacing: .04em; }
    #loading p { color: #8ee6e4; font-size: 18px; font-weight: 500; }
    .ring { width: 46px; height: 46px; border: 3px solid rgba(142,230,228,.25); border-top-color: #2ab5b4; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* three.js VRButton styling override to match brand */
    #VRButton { background: rgba(42,181,180,.15) !important; border: 2px solid #2ab5b4 !important; color: #eaf4f8 !important; font-weight: 600 !important; border-radius: 999px !important; }
    #hint { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); color: rgba(234,244,248,.55); font-size: 13px; z-index: 15; pointer-events: none; }
    #audio-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 16; background: rgba(42,181,180,.15); border: 1.5px solid #2ab5b4; color: #eaf4f8; font: 600 13px system-ui, sans-serif; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
    #audio-toggle:hover { background: rgba(42,181,180,.28); }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="loading">
    <h1>ETAFAT</h1>
    <div class="ring"></div>
    <p>Préparation de l'expérience immersive…</p>
  </div>
  <div id="hint">Glissez le globe pour le tourner · glissez ailleurs pour regarder autour (chiffres clés derrière vous) · « Enter VR » avec le casque</div>
  <button id="audio-toggle" type="button">♪ Son</button>
  <script type="module">
    import "./app.js";
    // hide the loader once the first frame has plausibly rendered
    addEventListener("load", () => setTimeout(() => document.getElementById("loading")?.classList.add("hide"), 1400));
    // offline service worker (precache everything for Quest offline use)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
